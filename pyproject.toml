[project]
name = "bankwidgettp"
version = "0.1.0"
description = ""
authors = [
    {name = "Tanya",email = "you@example.com"}
]
readme = "README.md"
packages = [
    { include = "bankwidgettp", from = "src" }
]
requires-python = ">=3.13"
dependencies = [
    "requests (>=2.32.3,<3.0.0)",
    "python-dotenv (>=1.1.0,<2.0.0)",
    "pandas (>=2.3.0,<3.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-cov = "^6.1.1"


[tool.poetry.group.lint.dependencies]
flake8 = "^7.2.0"
mypy = "^1.15.0"
black = "^25.1.0"
isort = "^6.0.1"

[tool.poetry.scripts]
start-tests = 'tests.test_utils:main'

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
check_untyped_defs = true
warn_unreachable = true
exclude = 'venv'

[tool.black]
line-length = 119
exclude = '''
(
  /(\.eggs|\.git|\.hg|\.mypy_cache|\.tox|\.venv|dist)/
  | foo.py
)
'''

[tool.isort]
line_length = 119
